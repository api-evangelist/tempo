apis:
- name: Tempo TraceQL API
  description: >-
    TraceQL is a query language developed for Grafana Tempo that allows filtering and selecting spans
    within traces. The TraceQL search API endpoint enables rich span-level filtering using a pipeline
    syntax with attribute matchers, duration filters, and structural operators.
  humanURL: https://grafana.com/docs/tempo/latest/traceql/
  baseURL: http://localhost:3200
